<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월전표등록 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <link rel="stylesheet" href="../../assets/css/accounting/monthly_voucher.css">
  <style>
    .search-bar {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .search-bar .sg { margin-bottom: 0; min-width: 150px; }
    .search-bar label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #555; }
    .search-bar input, .search-bar select {
      height: 36px; padding: 0 10px;
      border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 13px; width: 100%;
    }
    .search-bar .btn { height: 36px; padding: 0 18px; white-space: nowrap; }
    .rule-table-wrap { overflow-x: auto; }
    .rule-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rule-table th {
      background: #f3f4f6; border: 1px solid #e5e7eb;
      padding: 8px 10px; text-align: center;
      white-space: nowrap; font-weight: 600; color: #374151;
    }
    .rule-table td {
      border: 1px solid #e5e7eb; padding: 7px 10px;
      text-align: center; vertical-align: middle;
    }
    .rule-table tr:hover td { background: #f9fafb; }
    .badge-active {
      display: inline-block; padding: 2px 8px;
      border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .badge-active.on  { background: #dcfce7; color: #16a34a; }
    .badge-active.off { background: #f3f4f6; color: #9ca3af; }
    .btn-del {
      background: none; border: 1px solid #ef4444;
      color: #ef4444; border-radius: 4px;
      padding: 2px 8px; font-size: 12px; cursor: pointer;
    }
    .btn-del:hover { background: #fef2f2; }
    .empty-row td { color: #9ca3af; }
    .amount-cell { text-align: right !important; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="content-wrapper">
    <div class="page-header">
      <h1>월전표등록</h1>
      <p>회계관리 &gt; 전표등록 &gt; 월전표등록</p>
    </div>

    <!-- 등록 폼 -->
    <div class="erp-card">
      <div class="card-body">
        <form id="voucherForm">

          <div class="form-section">
            <h3 class="section-title">기본 정보</h3>
            <div class="form-grid">
              <div class="form-group">
                <label for="contractNumber">계약번호</label>
                <input type="text" id="contractNumber" name="contractNumber" placeholder="계약번호 입력 (선택사항)">
              </div>

              <div class="form-group">
                <label for="vehicleManagementId">차량관리번호</label>
                <input type="text" id="vehicleManagementId" name="vehicleManagementId" placeholder="차량관리번호 입력 (선택사항)">
              </div>

              <div class="form-group">
                <label for="monthlyDate" class="required">매월 전표발생일</label>
                <select id="monthlyDate" name="monthlyDate" required>
                  <option value="">날짜 선택</option>
                  <option value="1">매월 1일</option>
                  <option value="2">매월 2일</option>
                  <option value="3">매월 3일</option>
                  <option value="4">매월 4일</option>
                  <option value="5">매월 5일</option>
                  <option value="6">매월 6일</option>
                  <option value="7">매월 7일</option>
                  <option value="8">매월 8일</option>
                  <option value="9">매월 9일</option>
                  <option value="10">매월 10일</option>
                  <option value="11">매월 11일</option>
                  <option value="12">매월 12일</option>
                  <option value="13">매월 13일</option>
                  <option value="14">매월 14일</option>
                  <option value="15">매월 15일</option>
                  <option value="16">매월 16일</option>
                  <option value="17">매월 17일</option>
                  <option value="18">매월 18일</option>
                  <option value="19">매월 19일</option>
                  <option value="20">매월 20일</option>
                  <option value="21">매월 21일</option>
                  <option value="22">매월 22일</option>
                  <option value="23">매월 23일</option>
                  <option value="24">매월 24일</option>
                  <option value="25">매월 25일</option>
                  <option value="26">매월 26일</option>
                  <option value="27">매월 27일</option>
                  <option value="28">매월 28일</option>
                  <option value="29">매월 29일</option>
                  <option value="30">매월 30일</option>
                  <option value="31">매월 31일</option>
                </select>
              </div>

              <div class="form-group" style="grid-column: 1 / -1;">
                <label for="memo">메모</label>
                <input type="text" id="memo" name="memo" placeholder="월전표 메모(선택)">
              </div>
            </div>

            <div class="info-box">
              <span class="info-box-icon">&#x2139;&#xFE0F;</span>
              <span class="info-box-text">
                매월 해당일에 자동으로 전표가 발생됩니다. (스케줄러 적용 시)<br>
              </span>
            </div>
          </div>

          <div class="form-section">
            <h3 class="section-title debit-title">차변 (借)</h3>
            <div class="form-grid">
              <div class="form-group">
                <label for="debitAccount" class="required">계정명</label>
                <select id="debitAccount" name="debitAccount" required>
                  <option value="">계정 선택</option>
                </select>
              </div>

              <div class="form-group">
                <label for="debitAmount" class="required">금액</label>
                <input type="number" id="debitAmount" name="debitAmount" placeholder="금액을 입력하세요" required min="0">
              </div>

              <div class="form-group form-group-wide">
                <label for="debitDescription">적요</label>
                <input type="text" id="debitDescription" name="debitDescription" placeholder="적요를 입력하세요">
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3 class="section-title credit-title">대변 (貸)</h3>
            <div class="form-grid">
              <div class="form-group">
                <label for="creditAccount" class="required">계정명</label>
                <select id="creditAccount" name="creditAccount" required>
                  <option value="">계정 선택</option>
                </select>
              </div>

              <div class="form-group">
                <label for="creditAmount" class="required">금액</label>
                <input type="number" id="creditAmount" name="creditAmount" placeholder="금액을 입력하세요" required min="0">
              </div>

              <div class="form-group form-group-wide">
                <label for="creditDescription">적요</label>
                <input type="text" id="creditDescription" name="creditDescription" placeholder="적요를 입력하세요">
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="resetBtn">초기화</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">월전표 등록</button>
          </div>

        </form>
      </div>
    </div>

    <!-- 조회 섹션 -->
    <div class="erp-card" style="margin-top: 24px;">
      <div class="card-body">
        <h3 class="section-title" style="margin-bottom: 16px;">등록된 월전표 규칙 조회</h3>

        <div class="search-bar">
          <div class="sg">
            <label for="filterActive">활성여부</label>
            <select id="filterActive">
              <option value="">전체</option>
              <option value="true">활성</option>
              <option value="false">비활성</option>
            </select>
          </div>
          <div class="sg">
            <label for="filterContract">계약번호</label>
            <input type="text" id="filterContract" placeholder="계약번호 검색">
          </div>
          <button type="button" class="btn btn-primary" id="searchBtn">조회</button>
        </div>

        <div class="rule-table-wrap">
          <table class="rule-table">
            <thead>
              <tr>
                <th>No.</th>
                <th>활성</th>
                <th>계약번호</th>
                <th>발생일</th>
                <th>차변계정</th>
                <th>대변계정</th>
                <th>금액</th>
                <th>메모</th>
                <th>다음실행일</th>
                <th>마지막실행일</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody id="ruleTableBody">
              <tr class="empty-row"><td colspan="11">조회 버튼을 눌러 목록을 불러오세요.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/config.js"></script>

  <script>
    const API_BASE = (typeof API_BASE_URL !== "undefined" ? API_BASE_URL : "").replace(/\/+$/, "");
    function apiBase() { return API_BASE; }

    async function mustOk(res) {
      if (res.ok) return res;
      let msg = '';
      try { msg = await res.text(); } catch (e) {}
      throw new Error('HTTP ' + res.status + (msg ? (' - ' + msg) : ''));
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function fmtAmount(n) {
      return Number(n || 0).toLocaleString() + '원';
    }

    // ── 계정 목록 ────────────────────────────────────────────
    function buildAccountOptionsHtml(accounts) {
      if (!accounts || accounts.length === 0) {
        return '<option value="">계정 선택</option><option value="" disabled>등록된 계정이 없습니다 (재무제표관리에서 추가)</option>';
      }
      const groups = new Map();
      for (const a of accounts) {
        const key = a.parentName || "기타";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(a);
      }
      let html = '<option value="">계정 선택</option>';
      for (const [key, list] of groups) {
        html += '<optgroup label="' + escapeHtml(key) + '">';
        for (const a of list) {
          html += '<option value="' + escapeHtml(a.accountCode) + '" data-name="' + escapeHtml(a.accountName) + '">[' + escapeHtml(a.accountCode) + '] ' + escapeHtml(a.accountName) + '</option>';
        }
        html += '</optgroup>';
      }
      return html;
    }

    async function loadAccountOptions() {
      let html = '<option value="">계정 선택</option><option value="" disabled>계정 목록 조회 실패</option>';
      try {
        const res = await mustOk(await fetch(apiBase() + '/api/financial-statement-accounts/leaves'));
        const accounts = await res.json();
        html = buildAccountOptionsHtml(accounts);
      } catch (e) {
        console.error("계정 목록 조회 실패", e);
      }
      document.getElementById('debitAccount').innerHTML = html;
      document.getElementById('creditAccount').innerHTML = html;
    }

    loadAccountOptions();

    // ── 등록 폼 ──────────────────────────────────────────────
    document.getElementById('resetBtn').addEventListener('click', function() {
      if (confirm('입력한 내용을 모두 초기화하시겠습니까?')) {
        document.getElementById('voucherForm').reset();
      }
    });

    document.getElementById('voucherForm').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
    });

    document.getElementById('voucherForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const debitAmount = parseFloat(document.getElementById('debitAmount').value) || 0;
      const creditAmount = parseFloat(document.getElementById('creditAmount').value) || 0;

      if (debitAmount !== creditAmount) {
        alert('차변과 대변의 금액이 일치하지 않습니다.\n\n차변: ' + debitAmount.toLocaleString() + '원\n대변: ' + creditAmount.toLocaleString() + '원');
        return;
      }

      const monthlyDate = parseInt(document.getElementById('monthlyDate').value || '0', 10);
      if (!monthlyDate) { alert('매월 전표발생일을 선택하세요.'); return; }

      const rawMemo = (document.getElementById('memo').value || '').trim();
      const finalMemo = rawMemo ? '[월전표] ' + rawMemo : '[월전표]';

      const debitSel = document.getElementById('debitAccount');
      const creditSel = document.getElementById('creditAccount');

      const payload = {
        contractNumber: (document.getElementById('contractNumber').value || '').trim(),
        vehicleManagementId: (document.getElementById('vehicleManagementId').value || '').trim(),
        monthlyDate: monthlyDate,
        debitAccountCode: debitSel.value,
        debitAccount: debitSel.options[debitSel.selectedIndex]?.getAttribute('data-name') || debitSel.value,
        debitAmount: Math.round(debitAmount),
        debitDescription: (document.getElementById('debitDescription').value || '').trim(),
        creditAccountCode: creditSel.value,
        creditAccount: creditSel.options[creditSel.selectedIndex]?.getAttribute('data-name') || creditSel.value,
        creditAmount: Math.round(creditAmount),
        creditDescription: (document.getElementById('creditDescription').value || '').trim(),
        memo: finalMemo
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '저장 중...';

      try {
        const res = await mustOk(await fetch(apiBase() + '/api/accounting/monthly-voucher-rules', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }));
        const saved = await res.json();

        alert('월전표 규칙이 등록되었습니다.\n\n- ID: ' + saved.id + '\n- 다음 실행일: ' + (saved.nextRunDate || '') + '\n- 매월: ' + saved.monthlyDay + '일\n- 차변: ' + saved.debitAccount + ' ' + Number(saved.debitAmount).toLocaleString() + '원\n- 대변: ' + saved.creditAccount + ' ' + Number(saved.creditAmount).toLocaleString() + '원');

        document.getElementById('voucherForm').reset();
        loadRules();
      } catch (err) {
        console.error(err);
        alert('저장 실패\n\n' + (err && err.message ? err.message : String(err)));
      } finally {
        btn.disabled = false;
        btn.textContent = '월전표 등록';
      }
    });

    // ── 조회 기능 ────────────────────────────────────────────

    async function loadRules() {
      const activeVal = document.getElementById('filterActive').value;
      const contractVal = document.getElementById('filterContract').value.trim();

      const params = new URLSearchParams();
      if (activeVal !== '') params.set('activeOnly', activeVal);
      if (contractVal) params.set('contractNumber', contractVal);

      const tbody = document.getElementById('ruleTableBody');
      tbody.innerHTML = '<tr class="empty-row"><td colspan="11">조회 중...</td></tr>';

      try {
        const res = await mustOk(await fetch(apiBase() + '/api/accounting/monthly-voucher-rules?' + params.toString()));
        const list = await res.json();
        renderRules(list);
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr class="empty-row"><td colspan="11">조회 실패: ' + escapeHtml(err.message) + '</td></tr>';
      }
    }

    function renderRules(list) {
      const tbody = document.getElementById('ruleTableBody');
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="11">등록된 월전표 규칙이 없습니다.</td></tr>';
        return;
      }

      const rows = list.map(function(r, idx) {
        const activeCls = r.active ? 'on' : 'off';
        const activeLabel = r.active ? '활성' : '비활성';
        return '<tr>' +
          '<td>' + (idx + 1) + '</td>' +
          '<td><span class="badge-active ' + activeCls + '" onclick="toggleActive(' + r.id + ')" title="클릭하여 활성/비활성 전환">' + escapeHtml(activeLabel) + '</span></td>' +
          '<td>' + escapeHtml(r.contractNumber || '-') + '</td>' +
          '<td>매월 ' + escapeHtml(String(r.monthlyDay)) + '일</td>' +
          '<td>' + escapeHtml(r.debitAccount) + '</td>' +
          '<td>' + escapeHtml(r.creditAccount) + '</td>' +
          '<td class="amount-cell">' + fmtAmount(r.debitAmount) + '</td>' +
          '<td>' + escapeHtml(r.memo || '-') + '</td>' +
          '<td>' + escapeHtml(r.nextRunDate || '-') + '</td>' +
          '<td>' + escapeHtml(r.lastRunDate || '-') + '</td>' +
          '<td><button class="btn-del" onclick="deleteRule(' + r.id + ')">삭제</button></td>' +
          '</tr>';
      });
      tbody.innerHTML = rows.join('');
    }

    async function toggleActive(id) {
      try {
        await mustOk(await fetch(apiBase() + '/api/accounting/monthly-voucher-rules/' + id + '/toggle', { method: 'PATCH' }));
        loadRules();
      } catch (err) {
        alert('상태 변경 실패\n' + (err.message || String(err)));
      }
    }

    async function deleteRule(id) {
      if (!confirm('이 월전표 규칙을 삭제하시겠습니까?\n삭제 후에는 복구할 수 없습니다.')) return;
      try {
        await mustOk(await fetch(apiBase() + '/api/accounting/monthly-voucher-rules/' + id, { method: 'DELETE' }));
        loadRules();
      } catch (err) {
        alert('삭제 실패\n' + (err.message || String(err)));
      }
    }

    document.getElementById('searchBtn').addEventListener('click', loadRules);
    document.getElementById('filterContract').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadRules(); });

    // 페이지 진입 시 전체 목록 자동 조회
    loadRules();
  </script>
</body>
</html>
