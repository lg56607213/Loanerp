<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>은행내역업로드 | JDEND ERP</title>
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <style>
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .top-bar .btn-save {
      background:#1a73e8; color:#fff; border:none; border-radius:6px;
      padding:8px 22px; font-size:14px; font-weight:600; cursor:pointer;
    }
    .top-bar .btn-save:hover { background:#1558b0; }

    .search-section { background:#f8f9fa; border-radius:8px; padding:16px; margin-bottom:16px; }
    .search-grid { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group label { font-size:12px; font-weight:600; color:#555; }
    .form-group input, .form-group select {
      height:34px; padding:0 10px; border:1px solid #ccc; border-radius:5px; font-size:13px;
    }
    .upload-row { display:flex; align-items:flex-end; gap:8px; flex-wrap:wrap; margin-top:4px; }
    .btn-template {
      height:34px; padding:0 14px; background:#fff; border:1px solid #1a73e8;
      color:#1a73e8; border-radius:5px; font-size:13px; cursor:pointer; white-space:nowrap;
    }
    .btn-template:hover { background:#e8f0fe; }
    .btn-upload-label {
      height:34px; padding:0 14px; background:#34a853; color:#fff;
      border-radius:5px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center;
      white-space:nowrap;
    }
    .btn-upload-label:hover { background:#2d8f47; }
    .btn-search {
      height:34px; padding:0 20px; background:#1a73e8; color:#fff;
      border:none; border-radius:5px; font-size:13px; cursor:pointer;
    }
    .btn-search:hover { background:#1558b0; }
    .file-name { font-size:12px; color:#666; align-self:center; }

    .divider { border:none; border-top:1px solid #e0e0e0; margin:0 0 14px; }

    .table-container { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { background:#f1f3f4; font-weight:600; color:#444; padding:10px 8px; text-align:center;
         border-bottom:2px solid #ddd; white-space:nowrap; }
    td { padding:8px; border-bottom:1px solid #eee; text-align:center; color:#333; }
    tr:hover td { background:#f9fbff; }
    td.amount-cell { text-align:right; font-variant-numeric:tabular-nums; }
    td.deposit-cell { color:#1a73e8; font-weight:600; }
    td.withdrawal-cell { color:#d93025; font-weight:600; }
    td.balance-cell { color:#333; }
    td.no-data { text-align:center; color:#aaa; padding:40px; }

    /* 정렬 가능한 열 머리 */
    th.sortable { cursor:pointer; user-select:none; white-space:nowrap; }
    th.sortable:hover { background:#e8eef8; }
    th.sortable .sort-arrow { margin-left:4px; font-size:11px; color:#9aa7bd; }
    th.sortable.sorted .sort-arrow { color:#1a56db; }
    th.sortable.sorted { color:#1a56db; }

    /* 조회 결과 합계 */
    tfoot .sum-row td {
      background:#f1f5fb; border-top:2px solid #c9d8ef;
      font-weight:700; color:#1a3c7a; padding:12px 10px;
    }
    tfoot .sum-row #sumNote { font-weight:500; color:#5a6b85; font-size:12px; }

    .remarks-input {
      width:100%; min-width:120px; border:1px solid #ddd; border-radius:4px;
      padding:4px 8px; font-size:13px; box-sizing:border-box;
    }
    .remarks-input:focus { outline:none; border-color:#1a73e8; }

    .required-star { color:#d93025; }

  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="content-wrapper">
    <div class="page-header">
      <h1>은행내역업로드</h1>
      <p>수납관리 &gt; 은행내역 &gt; 은행내역업로드</p>
    </div>

    <div class="erp-card">
      <div class="card-body">

        <!-- 상단 저장 버튼 -->
        <div class="top-bar">
          <span style="font-size:13px;color:#555;">비고 작성 후 저장 버튼을 누르세요.</span>
          <button class="btn-save" onclick="saveRemarks()">저장</button>
        </div>

        <!-- 조회 + 업로드 섹션 -->
        <div class="search-section">
          <div class="search-grid">

            <div class="form-group">
              <label for="searchBank">은행명</label>
              <input type="text" id="searchBank" placeholder="은행명 검색" style="width:130px;">
            </div>

            <div class="form-group">
              <label for="searchStartDate">일자(시작)</label>
              <input type="text" id="searchStartDate" style="width:140px;" maxlength="10" inputmode="numeric" placeholder="20260801" oninput="normalizeDateInput(this)" onblur="normalizeDateInput(this)">
            </div>

            <div class="form-group">
              <label for="searchEndDate">일자(종료)</label>
              <input type="text" id="searchEndDate" style="width:140px;" maxlength="10" inputmode="numeric" placeholder="20260801" oninput="normalizeDateInput(this)" onblur="normalizeDateInput(this)">
            </div>

            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn-search" onclick="searchTransactions()">조회</button>
            </div>
            <div class="form-group">
              <label>&nbsp;</label>
              <button type="button" class="btn-excel" onclick="exportTableToExcel('transactionTableBody', '은행내역')">엑셀 내보내기</button>
            </div>
          </div>

          <hr class="divider" style="margin:14px 0 12px;">

          <!-- 업로드 영역 -->
          <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">
            <div class="form-group">
              <label for="uploadAccountPick">통장 <span class="required-star">*</span></label>
              <select id="uploadAccountPick" style="width:320px;" onchange="syncPickedAccount()">
                <option value="">불러오는 중…</option>
              </select>
              <!-- 실제 전송값. 통장 선택 시 채워진다 -->
              <input type="hidden" id="uploadBankName">
              <input type="hidden" id="uploadAccountNo">
            </div>
            <div class="form-group">
              <label>&nbsp;</label>
              <div class="upload-row">
                <button class="btn-template" onclick="downloadTemplate()">양식 다운로드</button>
                <label class="btn-upload-label" for="excelFile">엑셀 업로드</label>
                <input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none;" onchange="handleFileUpload(event)">
                <span class="file-name" id="fileName">선택된 파일 없음</span>
              </div>
            </div>
          </div>
          <div style="margin-top:8px;font-size:12px;color:#888;">
            ※ 양식을 다운로드 후 <strong>일자, 입금액, 출금액, 잔액, 적요</strong> 항목을 입력하여 업로드하세요.
          </div>
        </div>

        <!-- 결과 테이블 -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th class="sortable" data-sort-key="bankName"         data-sort-type="text" onclick="sortBy('bankName')">은행명<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort-key="accountNo"        data-sort-type="text" onclick="sortBy('accountNo')">계좌번호<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort-key="txDate"           data-sort-type="text" onclick="sortBy('txDate')">일자<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort-key="depositAmount"    data-sort-type="num"  onclick="sortBy('depositAmount')">입금액<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort-key="withdrawalAmount" data-sort-type="num"  onclick="sortBy('withdrawalAmount')">출금액<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort-key="balance"          data-sort-type="num"  onclick="sortBy('balance')">잔액<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort-key="summary"          data-sort-type="text" onclick="sortBy('summary')">적요<span class="sort-arrow"></span></th>
                <th class="sortable" data-sort-key="remarks"          data-sort-type="text" onclick="sortBy('remarks')">비고<span class="sort-arrow"></span></th>
              </tr>
            </thead>
            <tbody id="transactionTableBody">
              <tr>
                <td colspan="9" class="no-data">조회 또는 업로드 후 데이터가 표시됩니다.</td>
              </tr>
            </tbody>
            <tfoot id="transactionTableFoot" hidden>
              <tr class="sum-row">
                <td colspan="4">합계</td>
                <td class="amount-cell deposit-cell" id="sumDeposit">0</td>
                <td class="amount-cell withdrawal-cell" id="sumWithdrawal">0</td>
                <td class="amount-cell balance-cell" id="sumBalance">-</td>
                <td colspan="2" id="sumNote"></td>
              </tr>
            </tfoot>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script>
    // 현재 조회된 행 목록(비고 저장에 사용)
    let currentRows = [];

    function escapeHtml(s) {
      return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }
    /**
     * 일자 입력 도우미 — 숫자 8자리를 치면 YYYY-MM-DD 로 바꿔 준다.
     * 20260801 -> 2026-08-01. 이미 YYYY-MM-DD 로 친 경우는 그대로 둔다.
     * 달력 대신 숫자만 빠르게 치려는 입력을 받기 위한 것이다.
     */
    function normalizeDateInput(el) {
      const digits = el.value.replace(/[^0-9]/g, '');
      if (digits.length === 8) {
        el.value = digits.slice(0,4) + '-' + digits.slice(4,6) + '-' + digits.slice(6,8);
      }
    }

    /** 조회에 넘기기 전 한 번 더 정규화한다(붙여넣기 등으로 형식이 어긋난 경우). */
    function toISODate(v) {
      const t = String(v || '').trim();
      if (!t) return '';
      const d = t.replace(/[^0-9]/g, '');
      if (d.length === 8) return d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8);
      return t;
    }

    function todayISO() { return new Date().toISOString().split('T')[0]; }
    function startOfMonthISO() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
    }
    function fmtAmt(v) {
      const n = Number(v ?? 0);
      return n > 0 ? n.toLocaleString() : '-';
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('searchStartDate').value = startOfMonthISO();
      document.getElementById('searchEndDate').value   = todayISO();
      loadMyBankAccounts();
    });

    /**
     * 업로드 대상 통장을 '내정보관리 > 통장관리'에 등록된 목록에서 고르게 한다.
     * 직접 입력하면 같은 계좌를 조금씩 다르게 적어(예: 900-2082 / 9002082)
     * 같은 통장 내역이 갈라져 쌓인다.
     */
    async function loadMyBankAccounts() {
      const sel = document.getElementById('uploadAccountPick');
      try {
        const res = await fetch(`${API_BASE_URL}/api/my-info/bank-accounts?activeOnly=true`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const list = await res.json();

        if (!list.length) {
          sel.innerHTML = '<option value="">등록된 통장이 없습니다 — 내정보관리 &gt; 통장관리에서 먼저 등록하세요</option>';
          return;
        }

        sel.innerHTML = '<option value="">통장을 선택하세요</option>';
        list.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.dataset.bankName  = a.bankName || '';
          opt.dataset.accountNo = a.accountNumber || '';
          const tail = [a.accountAlias, a.accountHolder].filter(Boolean).join(' / ');
          opt.textContent = `${a.bankName} ${a.accountNumber}` + (tail ? ` (${tail})` : '');
          sel.appendChild(opt);
        });

        // 통장이 하나뿐이면 고를 것도 없으니 바로 선택해 둔다
        if (list.length === 1) { sel.selectedIndex = 1; }
        syncPickedAccount();
      } catch (e) {
        sel.innerHTML = '<option value="">통장 목록을 불러오지 못했습니다</option>';
        console.error('통장 목록 조회 실패', e);
      }
    }

    function syncPickedAccount() {
      const sel = document.getElementById('uploadAccountPick');
      const opt = sel.options[sel.selectedIndex];
      const picked = opt && opt.value;
      document.getElementById('uploadBankName').value  = picked ? opt.dataset.bankName  : '';
      document.getElementById('uploadAccountNo').value = picked ? opt.dataset.accountNo : '';
    }

    async function searchTransactions() {
      const bank      = document.getElementById('searchBank').value.trim();
      const startDate = toISODate(document.getElementById('searchStartDate').value);
      const endDate   = toISODate(document.getElementById('searchEndDate').value);

      const qs = new URLSearchParams();
      if (bank)      qs.set('bank', bank);
      if (startDate) qs.set('startDate', startDate);
      if (endDate)   qs.set('endDate', endDate);

      const tbody = document.getElementById('transactionTableBody');
      tbody.innerHTML = `<tr><td colspan="9" class="no-data">불러오는 중...</td></tr>`;

      try {
        const res = await fetch(`${API_BASE_URL}/api/bank-transactions?` + qs.toString());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentRows = await res.json();
        sortState = { key: null, dir: 'asc' };   // 새로 조회하면 서버 순서로 돌아간다
        renderRows(currentRows);
        updateSortIndicators();
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="9" class="no-data">조회 실패: ${escapeHtml(e.message)}</td></tr>`;
      }
    }

    // ── 정렬 ────────────────────────────────────────────────
    // 서버에서 받은 순서(일자 내림차순)가 기본이다. 열 머리를 누르면 그 열로
    // 오름차순, 한 번 더 누르면 내림차순으로 바꾼다.
    let sortState = { key: null, dir: 'asc' };

    function sortBy(key) {
      if (!currentRows || currentRows.length === 0) return;

      // 다시 그리기 전에 입력 중인 비고를 데이터에 옮겨 둔다.
      // 이걸 빼먹으면 정렬할 때마다 아직 저장하지 않은 비고가 사라진다.
      syncRemarksToData();

      sortState = (sortState.key === key)
        ? { key, dir: (sortState.dir === 'asc' ? 'desc' : 'asc') }
        : { key, dir: 'asc' };

      const th = document.querySelector(`th.sortable[data-sort-key="${key}"]`);
      const type = th ? th.dataset.sortType : 'text';
      const sign = sortState.dir === 'asc' ? 1 : -1;

      currentRows.sort((a, c) => {
        if (type === 'num') {
          return (Number(a[key] ?? 0) - Number(c[key] ?? 0)) * sign;
        }
        const x = String(a[key] ?? ''), y = String(c[key] ?? '');
        // 빈 값은 방향과 상관없이 항상 뒤로 보낸다.
        if (!x && !y) return 0;
        if (!x) return 1;
        if (!y) return -1;
        return x.localeCompare(y, 'ko') * sign;
      });

      renderRows(currentRows);
      updateSortIndicators();
    }

    /** 화면의 비고 입력값을 currentRows 에 반영한다. */
    function syncRemarksToData() {
      const byId = new Map(currentRows.map(r => [Number(r.id), r]));
      document.querySelectorAll('.remarks-input').forEach(inp => {
        const row = byId.get(Number(inp.dataset.id));
        if (row) row.remarks = inp.value;
      });
    }

    function updateSortIndicators() {
      document.querySelectorAll('th.sortable').forEach(th => {
        const arrow = th.querySelector('.sort-arrow');
        if (th.dataset.sortKey === sortState.key) {
          th.classList.add('sorted');
          arrow.textContent = sortState.dir === 'asc' ? '▲' : '▼';
        } else {
          th.classList.remove('sorted');
          arrow.textContent = '';
        }
      });
    }

    function renderRows(list) {
      const tbody = document.getElementById('transactionTableBody');
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="no-data">검색 결과가 없습니다.</td></tr>`;
        renderSummary([]);
        return;
      }

      tbody.innerHTML = list.map((it, idx) => {
        const dep = Number(it.depositAmount ?? 0);
        const wd  = Number(it.withdrawalAmount ?? 0);
        const bal = Number(it.balance ?? 0);
        return `
          <tr>
            <td>${idx + 1}</td>
            <td>${escapeHtml(it.bankName ?? '')}</td>
            <td>${escapeHtml(it.accountNo ?? '')}</td>
            <td>${escapeHtml(it.txDate ?? '')}</td>
            <td class="amount-cell ${dep > 0 ? 'deposit-cell' : ''}">${fmtAmt(dep)}</td>
            <td class="amount-cell ${wd > 0 ? 'withdrawal-cell' : ''}">${fmtAmt(wd)}</td>
            <td class="amount-cell balance-cell">${bal > 0 ? bal.toLocaleString() : '-'}</td>
            <td>${escapeHtml(it.summary ?? '')}</td>
            <td>
              <input class="remarks-input" type="text"
                data-id="${it.id}"
                value="${escapeHtml(it.remarks ?? '')}"
                placeholder="비고 입력">
            </td>
          </tr>`;
      }).join('');

      renderSummary(list);
    }

    /**
     * 조회된 내역의 합계를 표 맨 아래에 보여준다.
     * 잔액은 거래마다 누적되는 값이라 더해도 의미가 없으므로 합계를 내지 않고,
     * 대신 순증감(입금-출금)과 기간의 마지막 잔액을 보여준다.
     */
    function renderSummary(list) {
      const foot = document.getElementById('transactionTableFoot');
      if (!list || list.length === 0) { foot.hidden = true; return; }

      let dep = 0, wd = 0;
      for (const it of list) {
        dep += Number(it.depositAmount ?? 0);
        wd  += Number(it.withdrawalAmount ?? 0);
      }
      const net = dep - wd;

      document.getElementById('sumDeposit').textContent    = dep.toLocaleString();
      document.getElementById('sumWithdrawal').textContent = wd.toLocaleString();

      // 정렬로 순서가 바뀌어도 맞아야 하므로 첫 원소가 아니라 날짜로 찾는다.
      // 같은 날 여러 건이면 id 가 큰 쪽(나중에 들어온 행)을 최신으로 본다.
      const latest = list.reduce((a, c) => {
        const ad = String(a.txDate ?? ''), cd = String(c.txDate ?? '');
        if (cd > ad) return c;
        if (cd < ad) return a;
        return Number(c.id ?? 0) > Number(a.id ?? 0) ? c : a;
      });
      const latestBal = Number(latest?.balance ?? 0);
      document.getElementById('sumBalance').textContent =
        latestBal > 0 ? latestBal.toLocaleString() : '-';

      const sign = net > 0 ? '+' : '';
      const color = net > 0 ? '#1a73e8' : (net < 0 ? '#d93025' : '#5a6b85');
      document.getElementById('sumNote').innerHTML =
        `${list.length}건  ·  순증감 <span style="color:${color};font-weight:700;">${sign}${net.toLocaleString()}원</span>`
        + (latestBal > 0 ? `  (잔액은 ${escapeHtml(latest.txDate ?? '')} 기준)` : '');

      foot.hidden = false;
    }

    async function saveRemarks() {
      const inputs = document.querySelectorAll('.remarks-input');
      if (inputs.length === 0) { alert('저장할 내역이 없습니다.'); return; }

      const payload = Array.from(inputs).map(inp => ({
        id: Number(inp.dataset.id),
        remarks: inp.value
      }));

      try {
        const res = await fetch(`${API_BASE_URL}/api/bank-transactions/remarks`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        alert('비고가 저장되었습니다.');
      } catch (e) {
        alert('저장 실패: ' + e.message);
      }
    }

    async function downloadTemplate() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/bank-transactions/template`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = 'bank_transaction_template.xlsx';
        a.click();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('템플릿 다운로드 실패: ' + e.message);
      }
    }

    // ── 엑셀 업로드 ─────────────────────────────────────────

    /** 업로드 결과를 사람이 읽을 수 있는 줄 목록으로 만든다. */
    function describeResult(r) {
      const lines = [
        `전체 ${r.parsedRows}건`,
        `  저장 대상  ${r.insertedRows}건`,
        `  중복 제외  ${r.skippedDuplicates}건`,
        `  오류       ${r.failedRows || 0}건`
      ];

      const errs = r.errors || [];
      if (errs.length) {
        lines.push('', '── 오류 (저장되지 않음) ──');
        errs.slice(0, 15).forEach(e => {
          lines.push(`${e.rowNumber}행: ${e.reason}` + (e.value ? `  (값: ${e.value})` : ''));
        });
        if (errs.length > 15) lines.push(`… 외 ${errs.length - 15}건`);
      }

      const dups = r.duplicates || [];
      if (dups.length) {
        lines.push('', '── 중복으로 제외된 내역 ──');
        dups.slice(0, 15).forEach(d => {
          const amt = d.deposit > 0 ? `입금 ${d.deposit.toLocaleString()}`
                                    : `출금 ${d.withdrawal.toLocaleString()}`;
          lines.push(`${d.rowNumber}행: ${d.txDate}  ${amt}  잔액 ${Number(d.balance).toLocaleString()}  ${d.summary || ''}`);
          lines.push(`         → ${d.reason}`);
        });
        if (dups.length > 15) lines.push(`… 외 ${dups.length - 15}건`);
      }
      return lines;
    }

    async function postUpload(file, bankName, accountNo, dryRun) {
      const fd = new FormData();
      fd.append('bankName',  bankName);
      fd.append('accountNo', accountNo);
      fd.append('file', file);
      fd.append('dryRun', dryRun ? 'true' : 'false');

      const res = await fetch(`${API_BASE_URL}/api/bank-transactions/upload`, { method: 'POST', body: fd });
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { const e = await res.json(); if (e && e.message) msg = e.message; } catch (_) {}
        throw new Error(msg);
      }
      return await res.json();
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      const fileNameEl = document.getElementById('fileName');
      if (!file) { fileNameEl.textContent = '선택된 파일 없음'; return; }

      const bankName  = document.getElementById('uploadBankName').value.trim();
      const accountNo = document.getElementById('uploadAccountNo').value.trim();

      if (!bankName || !accountNo) {
        alert('업로드할 통장을 먼저 선택하세요.\n\n목록이 비어 있으면 내정보관리 > 통장관리에서 통장을 등록하세요.');
        event.target.value = '';
        return;
      }

      fileNameEl.textContent = file.name;

      try {
        // 1단계 — 저장하지 않고 검증만 해서 무엇이 빠지는지 먼저 보여준다
        const check = await postUpload(file, bankName, accountNo, true);

        if (check.insertedRows === 0) {
          alert(`저장할 내역이 없습니다.\n\n` + describeResult(check).join('\n'));
          return;
        }

        const head = `[${bankName} / ${accountNo}]\n${file.name}\n`;
        const tail = (check.failedRows || check.skippedDuplicates)
          ? '\n\n위 내용으로 저장할까요? (오류·중복 행은 제외됩니다)'
          : '\n\n저장할까요?';

        if (!confirm(head + describeResult(check).join('\n') + tail)) return;

        // 2단계 — 확인했으니 실제로 저장한다
        const saved = await postUpload(file, bankName, accountNo, false);
        alert('업로드 완료\n\n' + describeResult(saved).join('\n'));
        await searchTransactions();
      } catch (e) {
        alert('업로드 실패\n\n' + e.message);
      } finally {
        event.target.value = '';
        fileNameEl.textContent = '선택된 파일 없음';
      }
    }
  </script>
