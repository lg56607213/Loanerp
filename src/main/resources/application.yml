server:
  port: 8080
  # Cloudflare/리버스 프록시 뒤에서 X-Forwarded-Proto 를 인식해 https 로 판단하게 한다.
  # 이게 없으면 https 접속인데도 Secure 쿠키가 내려가지 않아 로그인이 유지되지 않는다.
  forward-headers-strategy: framework
  # 응답 압축: 터널(오리진→엣지) 전송량을 줄인다. Cloudflare 엣지 압축과는 별개.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,application/json,application/xml
    min-response-size: 1024
  servlet:
    # 이 서버의 JVM 기본 문자셋은 MS949 다(JDK 17 + 한글 윈도우).
    # 요청 인코딩을 명시하지 않으면 multipart 폼 파라미터(은행명 등)가
    # MS949 로 해석돼 한글이 U+FFFD 로 깨질 수 있다. 기본값에 기대지 않는다.
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 120m
      cookie:
        http-only: true
        same-site: lax
        # 로컬(http)에서는 false, 도메인(https) 붙일 때 COOKIE_SECURE=true 로 준다.
        secure: ${COOKIE_SECURE:false}

spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


# 구독결제 알림 수신 주소. 미지정 시 문의 수신 주소를 쓴다.
admin:
  email: ${ADMIN_EMAIL:${MAIL_USERNAME:}}

app:
  # 안내 메일에 넣을 ERP 접속 주소. 배포 도메인이 바뀌면 이 값만 바꾼다.
  erp-base-url: ${ERP_BASE_URL:https://erp.planbloan.co.kr}
  contact:
    recipient-email: ${MAIL_USERNAME}
  upload-dir: uploads/accounts
  multidb:
    default-db: auth
    datasources:
      auth:
        url: ${DB_URL_AUTH}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
