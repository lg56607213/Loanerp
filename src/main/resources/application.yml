server:
  port: 8080
  servlet:
    session:
      timeout: 120m

spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

codef:
  client-id: a872e297-5b27-459d-9896-5e02f2cb1d41
  client-secret: 6e341ebb-de76-4af6-9093-be61e5dfc242
  public-key: 
  base-url: https://api.codef.io
  oauth-url: https://oauth.codef.io

# 구독결제 알림 수신 주소. 미지정 시 문의 수신 주소를 쓴다.
admin:
  email: ${ADMIN_EMAIL:${MAIL_USERNAME:}}

app:
  contact:
    recipient-email: ${MAIL_USERNAME}
  upload-dir: uploads/accounts
  multidb:
    default-db: auth
    datasources:
      auth:
        url: ${DB_URL_AUTH}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
