server:
  port: 8080
  # Cloudflare/리버스 프록시 뒤에서 X-Forwarded-Proto 를 인식해 https 로 판단하게 한다.
  # 이게 없으면 https 접속인데도 Secure 쿠키가 내려가지 않아 로그인이 유지되지 않는다.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 120m
      cookie:
        http-only: true
        same-site: lax
        # 로컬(http)에서는 false, 도메인(https) 붙일 때 COOKIE_SECURE=true 로 준다.
        secure: ${COOKIE_SECURE:false}

spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# CODEF 계좌연동 자격증명.
# 시크릿은 절대 코드에 두지 않는다. 환경변수 또는 application-local.yml(gitignore)로 주입한다.
# 미설정 시 계좌연동 기능만 동작하지 않고 앱은 정상 기동한다.
codef:
  client-id: ${CODEF_CLIENT_ID:}
  client-secret: ${CODEF_CLIENT_SECRET:}
  public-key: ${CODEF_PUBLIC_KEY:}
  base-url: https://api.codef.io
  oauth-url: https://oauth.codef.io

# 구독결제 알림 수신 주소. 미지정 시 문의 수신 주소를 쓴다.
admin:
  email: ${ADMIN_EMAIL:${MAIL_USERNAME:}}

app:
  # 안내 메일에 넣을 ERP 접속 주소. 배포 도메인이 바뀌면 이 값만 바꾼다.
  erp-base-url: ${ERP_BASE_URL:https://erp.planbloan.co.kr}
  contact:
    recipient-email: ${MAIL_USERNAME}
  upload-dir: uploads/accounts
  multidb:
    default-db: auth
    datasources:
      auth:
        url: ${DB_URL_AUTH}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
